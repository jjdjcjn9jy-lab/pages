<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photo Printer</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <h1>Wedding Photo Printer</h1>
        <p class="subtitle" id="random-subtitle"></p>
    </header>

    <div class="app-container">
        <div class="status-message" id="status-message"></div>

        <div id="upload-section" class="step">
            <div class="upload-area" onclick="document.getElementById('image-input').click()">
                <p><strong>Step 1:</strong> Tap to choose your photo</p>
                <input type="file" id="image-input" accept="image/*" style="display:none">
                <p style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    Supported formats: JPG, PNG<br>
                    Large images will be automatically resized
                </p>
            </div>
        </div>

        <div id="crop-section" class="step">
            <p style="margin-bottom: 15px; font-weight: bold;">Step 2: Adjust your square crop</p>
            <div id="cropper-container">
                <img id="image-to-crop">
            </div>
            <div class="button-group">
                <button id="rotate-button" class="btn-rotate">Rotate Image</button>
                <button id="crop-button">Confirm Crop</button>
            </div>
        </div>

        <div id="print-section" class="step">
            <p><strong>Step 3: Final Preview</strong></p>
            <img id="cropped-result">
            <div class="button-group">
                <button id="print-button">🖨️ Print This Photo</button>
                <button onclick="location.reload()" class="btn-secondary">Start Afresh</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="js/subtitleManager.js"></script>
    <script src="js/statusManager.js"></script>
    <script src="js/imageProcessor.js"></script>
    <script src="js/themeManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
